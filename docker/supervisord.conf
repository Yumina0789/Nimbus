; Nimbus 容器里的两个进程（被 supervisord 管理，主配置由 alpine 的
; /etc/supervisor/supervisord.conf 提供，这个文件放在 conf.d 里被 include）。
;
; 为什么 vlmcsd 要写日志文件：容器里没有 journald，面板改成读这个文件来做
; 实时统计（nimbus.py --supervisor --log-file /var/log/vlmcsd.log）。
; 同时让它的 stdout 也进容器日志，方便 docker logs 直接看。

[program:vlmcsd]
command=/usr/local/bin/vlmcsd -D -e -T0 -P 1688 -L 0.0.0.0:1688 -L [::]:1688 -m 256 -t 30 -i /etc/vlmcsd/vlmcsd.ini -l /var/log/vlmcsd.log -v 3
directory=/tmp
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nimbus]
command=/usr/local/bin/python3 /opt/nimbus/nimbus.py --mode real --supervisor --bind 0.0.0.0 --port 8099 --data-dir /var/lib/nimbus --token-file /var/lib/nimbus/nimbus.token --unit vlmcsd --ini /etc/vlmcsd/vlmcsd.ini --log-file /var/log/vlmcsd.log
directory=/tmp
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
