name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile and parse
        run: |
          set -euo pipefail
          python3 -m py_compile nimbus.py
          python3 -c 'import ast,pathlib; s=pathlib.Path("nimbus.py").read_text(encoding="utf-8"); ast.parse(s); print("nimbus.py parsed:", len(s.splitlines()), "lines")'

      - name: 界面结构自检（标签配平 / 导航指向 / JS 语法）
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib
          from html.parser import HTMLParser
          VOID = {"area","base","br","col","embed","hr","img","input","link","meta","param","source","track","wbr"}
          html = pathlib.Path("ui.html").read_text(encoding="utf-8")
          assert html.lstrip().lower().startswith("<!doctype html>"), "页面不是以 <!DOCTYPE html> 开头"
          assert html.rstrip().endswith("</html>"), "页面没有正常收尾"

          class B(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.stack=[]; self.bad=[]
              def handle_starttag(self, tag, attrs):
                  if tag not in VOID: self.stack.append((tag, self.getpos()[0]))
              def handle_endtag(self, tag):
                  if tag in VOID: return
                  if not self.stack: self.bad.append("多的 </%s> 第 %d 行" % (tag, self.getpos()[0]))
                  elif self.stack[-1][0] != tag:
                      top, line = self.stack.pop()
                      self.bad.append("</%s> 第 %d 行对不上 <%s> 第 %d 行" % (tag, self.getpos()[0], top, line))
                  else: self.stack.pop()
          b = B(); b.feed(html)
          left = ["<%s> 第 %d 行没关" % (t, l) for t, l in b.stack]
          assert not b.bad and not left, b.bad + left

          tabs = set(re.findall(r'data-tab="([a-z]+)"', html))
          assert not (tabs - set(re.findall(r'id="tab-([a-z]+)"', html))), "有导航按钮指向不存在的标签页"
          ids = set(re.findall(r'id="([A-Za-z0-9_-]+)"', html))
          js = re.search(r"<script>(.*)</script>", html, re.S).group(1)
          missing = set(re.findall(r'getElementById\("([A-Za-z0-9_-]+)"\)', js)) - ids
          assert not missing, "脚本引用了不存在的 id：%s" % sorted(missing)
          print("ui.html 结构自检通过：标签配平、%d 个标签页、id 引用完整" % len(tabs))
          PY
          if command -v node >/dev/null 2>&1; then
            python3 -c 'import re,pathlib; h=pathlib.Path("ui.html").read_text(encoding="utf-8"); pathlib.Path("ui.js").write_text(re.search(r"<script>(.*)</script>", h, re.S).group(1), encoding="utf-8")'
            node --check ui.js && echo "界面 JS 语法通过"
          else
            echo "没装 node，跳过 JS 语法检查"
          fi

      - name: Demo smoke test (start, probe, stop)
        run: |
          set -euo pipefail
          DATA="$RUNNER_TEMP/nimbus-demo"
          python3 nimbus.py --mode demo --port 8099 --token testtoken --data-dir "$DATA" >"$RUNNER_TEMP/demo.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS -o /dev/null "http://127.0.0.1:8099/"; then ready=1; break; fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            echo "server never came up:"; cat "$RUNNER_TEMP/demo.log"; exit 1
          fi

          echo "--- GET / ---"
          curl -fsS "http://127.0.0.1:8099/" -o "$RUNNER_TEMP/index.html"
          grep -q '<title>Nimbus 管理面板</title>' "$RUNNER_TEMP/index.html"
          # 光看 <title> 不够：JSON 转义不动尖括号，所以整页被 json.dumps 之后 grep 照样命中
          # （Steward 就栽在这上面：页面被当成 JSON 字符串发出去，浏览器当纯文本渲染 = 没有 CSS）。
          head -c 20 "$RUNNER_TEMP/index.html" | grep -qi '<!doctype html>' \
            || { echo "页面不是以 <!DOCTYPE html> 开头的 HTML："; head -c 120 "$RUNNER_TEMP/index.html"; exit 1; }
          tail -c 20 "$RUNNER_TEMP/index.html" | grep -qi '</html>' \
            || { echo "页面没有正常结尾（可能被截断）"; exit 1; }
          grep -q '<style>' "$RUNNER_TEMP/index.html" || { echo "页面里没有 <style> 块"; exit 1; }
          echo "GET / -> 200, 是完整 HTML（含样式）"

          echo "--- GET /api/meta ---"
          curl -fsS "http://127.0.0.1:8099/api/meta" -o "$RUNNER_TEMP/meta.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert d["mode"]=="demo", d; assert d["real"] is False, d; print("meta ok:", d["version"], d["mode"])' "$RUNNER_TEMP/meta.json"

          echo "--- GET /api/summary with Bearer token ---"
          curl -fsS -H "Authorization: Bearer testtoken" "http://127.0.0.1:8099/api/summary" -o "$RUNNER_TEMP/summary.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert "service" in d and "stats" in d and "execstart" in d, sorted(d); print("summary ok:", d["service"]["version"], "storage", d["stats"]["quota_bytes"])' "$RUNNER_TEMP/summary.json"

          echo "--- GET /api/summary without token must be 401 ---"
          code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8099/api/summary")"
          echo "unauthorized status: $code"
          test "$code" = "401"

          echo "--- POST /api/login with the wrong token must be 403 ---"
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"token":"nope"}' "http://127.0.0.1:8099/api/login")"
          echo "bad login status: $code"
          test "$code" = "403"

          echo "--- 账户：首次设置 → 登录 → 账户管理 ---"
          curl -fsS "http://127.0.0.1:8099/api/auth" -o "$RUNNER_TEMP/auth.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert d["need_setup"] is True, d; assert d["password_min"] >= 8, d; print("need_setup ok")' "$RUNNER_TEMP/auth.json"

          echo "短密码要被拒"
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"name":"ci","password":"short"}' "http://127.0.0.1:8099/api/setup")"
          test "$code" = "400"

          echo "首次设置账户"
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"name":"ci","password":"ci-password"}' "http://127.0.0.1:8099/api/setup" -o "$RUNNER_TEMP/setup.json"
          SESSION="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert d["ok"] and d["session"], d; print(d["session"])' "$RUNNER_TEMP/setup.json")"
          echo "拿到会话令牌"

          echo "有账户之后再调 setup 必须 403"
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"name":"x","password":"xxxxxxxx"}' "http://127.0.0.1:8099/api/setup")"
          test "$code" = "403"

          echo "用会话令牌访问受保护接口"
          curl -fsS -H "Authorization: Bearer $SESSION" "http://127.0.0.1:8099/api/accounts" -o "$RUNNER_TEMP/accounts.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert [u["name"] for u in d["users"]] == ["ci"], d; assert d["me"] == "ci", d; print("accounts ok:", d["users"])' "$RUNNER_TEMP/accounts.json"

          echo "新增账户"
          curl -fsS -X POST -H "Authorization: Bearer $SESSION" -H 'Content-Type: application/json' -d '{"name":"ci2","password":"ci2-password"}' "http://127.0.0.1:8099/api/accounts/create" -o "$RUNNER_TEMP/create.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert d["ok"] and len(d["users"]) == 2, d; print("create ok")' "$RUNNER_TEMP/create.json"

          echo "新账户能登录"
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"name":"ci2","password":"ci2-password"}' "http://127.0.0.1:8099/api/login" -o "$RUNNER_TEMP/login2.json"
          S2="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["session"])' "$RUNNER_TEMP/login2.json")"

          echo "改密码后旧会话必须失效"
          curl -fsS -X POST -H "Authorization: Bearer $SESSION" -H 'Content-Type: application/json' -d '{"name":"ci2","password":"ci2-password2","actor_password":"ci-password"}' "http://127.0.0.1:8099/api/accounts/password" -o "$RUNNER_TEMP/pw.json"
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $S2" "http://127.0.0.1:8099/api/accounts")"
          echo "旧会话状态: $code"; test "$code" = "401"

          echo "错密码 403 / 当前密码不对改不了"
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"name":"ci","password":"wrong"}' "http://127.0.0.1:8099/api/login")"
          test "$code" = "403"
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $SESSION" -H 'Content-Type: application/json' -d '{"name":"ci2","password":"whatever1","actor_password":"wrong"}' "http://127.0.0.1:8099/api/accounts/password")"
          test "$code" = "403"

          echo "--- 递增封禁：错满就封，而且一次比一次久 ---"
          for _ in $(seq 1 8); do
            curl -s -o /dev/null -X POST -H 'Content-Type: application/json' -d '{"name":"ci","password":"wrong"}' "http://127.0.0.1:8099/api/login" || true
          done
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"name":"ci","password":"ci-password"}' "http://127.0.0.1:8099/api/login")"
          echo "被封之后连正确密码也是: $code"; test "$code" = "429"

          curl -fsS -H "Authorization: Bearer $SESSION" "http://127.0.0.1:8099/api/accounts" -o "$RUNNER_TEMP/guard.json"
          python3 -c 'import json,sys; g=json.load(open(sys.argv[1],encoding="utf-8"))["guard"]; assert g["tiers"]==[300,1800,21600], g; b=g["blocked"]; assert b and b[0]["level"]==1, g; print("guard ok:", b[0])' "$RUNNER_TEMP/guard.json"
          test -f "$DATA/loginguard.json" || { echo "封禁状态没有落盘"; exit 1; }
          python3 -c 'import json,os,stat,sys; p=sys.argv[1]; d=json.load(open(p,encoding="utf-8")); assert d["ips"], d; print("loginguard.json 落盘 ok, mode", oct(stat.S_IMODE(os.stat(p).st_mode)))' "$DATA/loginguard.json"

          echo "解封接口（服务 token 走的就是「自己被封了怎么救」那条路）"
          curl -fsS -X POST -H "Authorization: Bearer testtoken" -H 'Content-Type: application/json' -d '{"ip":"127.0.0.1"}' "http://127.0.0.1:8099/api/accounts/unblock" -o "$RUNNER_TEMP/unblock.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert d["ok"] and d["cleared"] is True, d; print("unblock ok")' "$RUNNER_TEMP/unblock.json"
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"name":"ci","password":"ci-password"}' "http://127.0.0.1:8099/api/login")"
          echo "解封后登录: $code"; test "$code" = "200"
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer testtoken" -H 'Content-Type: application/json' -d '{"ip":"不是IP"}' "http://127.0.0.1:8099/api/accounts/unblock")"
          test "$code" = "400"

          echo "删除账户；最后一个删不掉"
          curl -fsS -X POST -H "Authorization: Bearer $SESSION" -H 'Content-Type: application/json' -d '{"name":"ci2"}' "http://127.0.0.1:8099/api/accounts/delete" >/dev/null
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $SESSION" -H 'Content-Type: application/json' -d '{"name":"ci"}' "http://127.0.0.1:8099/api/accounts/delete")"
          test "$code" = "400"

          echo "账户事件进了统计库的 auth 表"
          curl -fsS -H "Authorization: Bearer $SESSION" "http://127.0.0.1:8099/api/accounts" -o "$RUNNER_TEMP/accounts2.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert d["log"], d; print("auth log ok:", len(d["log"]), "条")' "$RUNNER_TEMP/accounts2.json"

          echo "服务 token 仍然可用于机器调用（Steward 靠它拉限流决策）"
          curl -fsS -H "Authorization: Bearer testtoken" "http://127.0.0.1:8099/api/enforce/pending" -o "$RUNNER_TEMP/pending.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert "ban" in d and "unban" in d, d; print("service token ok")' "$RUNNER_TEMP/pending.json"

          echo "退出登录后旧会话失效"
          curl -fsS -X POST -H "Authorization: Bearer $SESSION" "http://127.0.0.1:8099/api/logout" >/dev/null
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $SESSION" "http://127.0.0.1:8099/api/accounts")"
          echo "退出后: $code"; test "$code" = "401"

          kill "$pid"
          wait "$pid" 2>/dev/null || true
          echo "demo smoke test passed"

      - name: LoginGuard 递增档位与落盘
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, pathlib, tempfile
          spec = importlib.util.spec_from_file_location("nimbus", "nimbus.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          p = pathlib.Path(tempfile.mkdtemp()) / "loginguard.json"
          g = m.LoginGuard(p, window=300, limit=2, tiers=(1, 2, 3))
          ip = "203.0.113.7"
          assert g.wait_seconds(ip) == 0
          assert g.fail(ip)[0] is False, "没到次数不该封"
          blocked, secs, level = g.fail(ip)
          assert blocked and secs == 1 and level == 1, (blocked, secs, level)
          assert g.wait_seconds(ip) > 0
          assert p.exists(), "状态没有落盘"
          g2 = m.LoginGuard(p, window=300, limit=2, tiers=(1, 2, 3))
          assert g2.wait_seconds(ip) > 0, "重启后封禁丢了"
          g2.unblock(ip)
          assert g2.wait_seconds(ip) == 0, "解封没生效"
          g2.fail(ip)
          blocked, secs, level = g2.fail(ip)
          assert blocked and secs == 2 and level == 2, (blocked, secs, level, "解封后档位该保留")
          g2.ok(ip)
          assert g2.wait_seconds(ip) == 0 and g2.fails_in_window(ip) == 0, "登录成功该清零"
          assert g2.wait_seconds("198.51.100.9") == 0, "只按 IP 封，别牵连别的来源"
          print("LoginGuard 递增封禁 + 落盘 + 解封保留档位 ok")
          PY

      - name: Real mode without a KMS service must not crash
        run: |
          set -euo pipefail
          DATA="$RUNNER_TEMP/nimbus-real"
          python3 nimbus.py --mode real --port 8100 --token testtoken --data-dir "$DATA" \
            --unit vlmcsd-does-not-exist --ini "$RUNNER_TEMP/absent-vlmcsd.ini" >"$RUNNER_TEMP/real.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS -o /dev/null "http://127.0.0.1:8100/api/meta"; then ready=1; break; fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            echo "real-mode server never came up:"; cat "$RUNNER_TEMP/real.log"; exit 1
          fi

          curl -fsS -H "Authorization: Bearer testtoken" "http://127.0.0.1:8100/api/summary" -o "$RUNNER_TEMP/real-summary.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); s=d["service"]; assert s["available"] is False, s; assert s["running"] is False, s; assert s.get("hint"), s; print("real mode degrades gracefully:", s["hint"])' "$RUNNER_TEMP/real-summary.json"

          curl -fsS -H "Authorization: Bearer testtoken" "http://127.0.0.1:8100/api/logs" -o "$RUNNER_TEMP/real-logs.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert d["lines"], d; print("real mode logs fallback ok")' "$RUNNER_TEMP/real-logs.json"

          kill "$pid"
          wait "$pid" 2>/dev/null || true

  shell:
    name: shellcheck and installer checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax check
        run: bash -n install.sh

      - name: shellcheck
        run: |
          if [ -f install.sh ]; then
            shellcheck --version
            shellcheck install.sh
          else
            echo "no install.sh present"
          fi

      - name: install.sh --help
        run: |
          set -euo pipefail
          out="$(bash install.sh --help)"
          printf '%s\n' "$out"
          for kw in --with-vlmcsd --no-vlmcsd --kms-port; do
            if ! printf '%s' "$out" | grep -q -- "$kw"; then
              echo "help output is missing: $kw" >&2
              exit 1
            fi
          done
          echo "help output mentions all documented KMS flags"
