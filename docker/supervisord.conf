; Nimbus 容器里的两个进程（被 supervisord 管理，主配置由 alpine 的
; /etc/supervisor/supervisord.conf 提供，这个文件放在 conf.d 里被 include）。
;
; 为什么 vlmcsd 要写日志文件：容器里没有 journald，面板改成读这个文件来做
; 实时统计（nimbus.py --supervisor --log-file /var/log/vlmcsd.log）。
; 同时让它的 stdout 也进容器日志，方便 docker logs 直接看。

[program:vlmcsd]
; "-v" 是开关（log verbose），它不接数字：写成 "-v 3" 会让 vlmcsd 打印 usage
; 并以 exit status 22 退出。统计需要详细日志，所以这里开着 -v。
command=/usr/local/bin/vlmcsd -D -e -T0 -P 1688 -L 0.0.0.0:1688 -L [::]:1688 -m 256 -t 30 -i /etc/vlmcsd/vlmcsd.ini -l /var/log/vlmcsd.log -v
directory=/tmp
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=5
; 注意：vlmcsd 的输出直接落进日志文件，不走 /dev/stdout。
; 原因：ini 里的 LogFile=syslog 会压过命令行的 -l，而容器里没有 syslog，
; 于是 vlmcsd 把日志吐到 stdout —— 面板读的却是文件，统计永远为空。
; 让 supervisord 把它的输出写进文件，面板的管道才有数据。
stdout_logfile=/var/log/vlmcsd.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=1
stderr_logfile=/var/log/vlmcsd.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=1

[program:nimbus]
; --caddyfile / --caddy-admin / --caddy-cert-dir 让面板上的「域名与 HTTPS」读改的是
; 真实配置（compose 把宿主的 Caddyfile 和 caddy-data 卷挂进来了），而不是生成一段
; 模板让人去抄。KMS 的域名走环境变量 NIMBUS_KMS_HOST（只用来生成 DNS 记录）。
command=/usr/local/bin/python3 /opt/nimbus/nimbus.py --mode real --supervisor --bind 0.0.0.0 --port 8099 --data-dir /var/lib/nimbus --token-file /var/lib/nimbus/nimbus.token --unit vlmcsd --ini /etc/vlmcsd/vlmcsd.ini --log-file /var/log/vlmcsd.log --caddyfile /etc/caddy/Caddyfile --caddy-admin http://caddy:2019 --caddy-cert-dir /caddy-data/caddy/certificates --caddy-upstream kms:8099
directory=/tmp
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
